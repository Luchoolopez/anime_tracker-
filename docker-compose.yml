services:
  mongodb:
    image: mongo:latest
    container_name: anime_tracker_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anime_tracker_backend
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/anime_tracker
    ports:
      - "3001:3000"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anime_tracker_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data: